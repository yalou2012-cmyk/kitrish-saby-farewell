name: Build static site for Yandex

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build root static export
        run: pnpm build
        env:
          ROOT_EXPORT: "true"

      - name: Upload Yandex artifact
        uses: actions/upload-artifact@v4
        with:
          name: yandex-static-site
          path: out
